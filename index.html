<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Petersen Family Tree</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fffcf7">
<link rel="stylesheet" href="style.css">
</head>
<body class="tree">
<header>
<div class="brand"><p class="eyebrow">Redwood County, Minnesota</p><h1>The Petersen Family</h1></div>
<nav aria-label="Primary"><a class="on" href="index.html" aria-current="page">Tree</a><a href="sources.html">Sources</a><a href="story/index.html">Story</a></nav>
</header>
<div class="banner"></div>
<div class="toolbar">
<details class="legend" id="legend">
<summary>Key</summary>
<div class="legend-body" id="legendbody">
<p><span class="keychip family">Family</span> Family-confirmed</p>
<p><span class="keychip records">Records</span> Record-sourced, not confirmed by family</p>
<p><span class="keychip living">Dashed</span> Living person</p>
<p class="legend-help">Drag or pinch to move. Tap a person for details.</p>
</div>
</details>
<div class="ctrl" role="group" aria-label="Zoom">
<button id="zo" type="button">Zoom out</button>
<button id="zr" type="button">Fit</button>
<button id="zi" type="button">Zoom in</button>
</div>
</div>
<main class="stage">
<div id="treewrap">
<svg id="svg" aria-label="Petersen family tree"><g id="vp"></g></svg>
</div>
<aside id="sheet" aria-labelledby="sheetlabel">
<div class="sheetbar" id="sheetbar">
<button id="sheetclose" class="sheetclose" type="button" aria-expanded="false" aria-controls="panel" aria-label="Show details">
<span class="handle" aria-hidden="true"></span>
<span class="sheetline"><span id="sheetlabel">Tap a person</span><span id="sheetaction">Details</span></span>
</button>
</div>
<div class="peek-spacer" aria-hidden="true"></div>
<div id="panel">
<h2>Select a person</h2>
<p class="empty-cta">Tap a name on the tree to see dates, relatives, and sources.</p>
</div>
</aside>
</main>
<div id="safeprobe" aria-hidden="true"></div>
<script src="data.js"></script>
<script src="common.js"></script>
<script src="tree.js"></script>
</body>
</html>
