<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sources · Petersen Family Tree</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>The Petersen Family · Redwood County, Minnesota</h1><nav><a href="index.html">Tree</a><a class="on" href="sources.html">Sources &amp; citation log</a></nav></header>
<div class="banner"></div><div class="wrap"><h2 style="font-weight:normal">Sources &amp; citation log <span class="muted" style="font-size:.9rem">(accessed 2026-11-02)</span></h2>
<p class="muted">Find a Grave and index sites are secondary. Entries marked excluded/unrelated/unconfirmed are kept for the record and are <b>not</b> linked to anyone.</p>
<table><thead><tr><th>ID</th><th>Source</th><th>Cited for</th></tr></thead><tbody id="tb"></tbody></table><div id="notes"></div></div>
<script src="data.js"></script><script src="common.js"></script><script>
const cites={};PEOPLE.people.forEach(p=>(p.sources||[]).forEach(s=>(cites[s]=cites[s]||[]).push(p)));
tb.innerHTML=Object.values(SOURCES).map(S=>`<tr id="${S.id}"><td><b>${S.id}</b>${S.flag?`<br><i class="muted">${esc(S.flag)}</i>`:''}</td><td>${esc(S.text.replace(/https?:\/\/[^\s)]+/g,'').replace(/:\s*$/,''))}<br>${S.urls.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join('<br>')||'<span class="muted">no URL (offline / search page)</span>'}</td><td>${(cites[S.id]||[]).map(p=>esc(p.name)).join('<br>')||'<span class="muted">—</span>'}</td></tr>`).join('');
const direct=PEOPLE.people.flatMap(p=>(p.sources||[]).filter(s=>/^https?:/.test(s)).map(s=>`<li><a href="${esc(s)}" target="_blank">${esc(s)}</a> — ${esc(p.name)}</li>`));
notes.innerHTML=SOURCE_NOTES.map(n=>`<p class="muted">${esc(n)}</p>`).join('')+(direct.length?`<h3 style="font-weight:normal">Direct links cited in people.json</h3><ul>${direct.join('')}</ul>`:'');
if(location.hash)document.querySelector(location.hash)?.scrollIntoView();
</script></body></html>
